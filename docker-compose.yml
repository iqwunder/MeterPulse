services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-meterpulse}
      MARIADB_USER: ${DB_USER:-meterpulse}
      MARIADB_PASSWORD: ${DB_PASSWORD:-meterpulse-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    ports:
      - "3306:3306"
    volumes:
      - meterpulse-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  meterpulse-data: